<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dr. Pool Chalkboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Patrick+Hand&family=Patrick+Hand+SC&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="frame"><main class="board">

  <div id="app" hidden>
    <header>
      <h1>Dr. Pool inbox board</h1>
      <div>
        <div class="sweep" id="sweep">Loading...</div>
        <div class="whoami"><span id="who"></span></div>
      </div>
    </header>
    <div class="stats" id="stats" aria-live="polite"></div>
    <div class="tools"><button class="btn" id="copyAll" type="button">Copy open list</button></div>
    <div id="sections"></div>
    <div class="empty" id="empty" hidden>Board is clear<small id="emptySmall">Items from the hourly inbox sweep show up here. Check them off when handled.</small></div>
    <details class="tray" id="tray" hidden><summary id="traySum">Done</summary><ul id="doneList"></ul></details>
  </div>

</main></div>
<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
